name = "valentina-bot"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# KV Namespace buat simpan history chat
[[kv_namespaces]]
binding = "VALENTINA_KV"
id = "GANTI_DENGAN_KV_NAMESPACE_ID_KAMU"
preview_id = "GANTI_DENGAN_PREVIEW_ID_KAMU"

# Model config (JeRouter V2 → step-5-unrestricted)
[vars]
MODEL_API_URL = "https://je.jerouter.web.id/v1/chat/completions"
MODEL_NAME = "step-5-unrestricted"